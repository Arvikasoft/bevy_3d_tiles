name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Private names must never reach this public repo. Scans the branch name, every
  # file path, the commit messages this push or PR adds, every tracked file, and
  # the PR title and body (edits: text-gate.yml) against
  # the PUBLISH_DENY_REGEX secret; .github/deny-scan.sh prints only where a name
  # is. Fork PRs get no secrets, so they skip with a notice; a push to main fails.
  # A red run is the alert: the text is already public, so remove it at once.
  deny-scan:
    name: deny-list scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan
        env:
          DENY: ${{ secrets.PUBLISH_DENY_REGEX }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [ -z "$DENY" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then echo "::error::set the PUBLISH_DENY_REGEX secret"; exit 1; fi
            echo "::notice::PUBLISH_DENY_REGEX is not available to this run (fork PRs get no secrets): deny-list scan skipped"
            exit 0
          fi
          T="$RUNNER_TEMP/scan-text"; mkdir -p "$T"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range=("$BASE..$HEAD")
            jq -r '.pull_request.title, (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > "$T/pr-title-body"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range=("$BEFORE..$GITHUB_SHA")
          else   # a new branch (before is all zeros) or a force push: the last 50 commits
            range=(-50 "$GITHUB_SHA")
          fi
          for c in $(git rev-list "${range[@]}"); do
            git log -1 --format=%B "$c" > "$T/commit-$c"
          done
          mapfile -t files < <(git ls-files)
          # Names first and alone: the content scan prints file paths.
          git ls-files > "$T/file-paths"
          printf '%s\n' "$GITHUB_REF_NAME" "${GITHUB_HEAD_REF:-}" > "$T/ref-names"
          bash .github/deny-scan.sh "$T/file-paths" "$T/ref-names"
          shopt -s nullglob
          bash .github/deny-scan.sh "${files[@]}" "$T"/*

  test:
    name: fmt · clippy · test · wasm · features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path prepare/Cargo.toml
      - name: clippy (native, all features)
        run: |
          cargo clippy --all-features --all-targets -- -D warnings
          cargo clippy --manifest-path prepare/Cargo.toml --all-targets -- -D warnings
      - name: clippy (wasm32, all features)
        run: cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings
      - name: test (all features)
        run: |
          cargo test --all-features
          cargo test --manifest-path prepare/Cargo.toml
      # The whole point of the prepare split: the crate a Web Worker links must
      # never grow a bevy edge. First line of `cargo tree` is the package itself
      # (whose NAME contains "bevy"), so skip it before grepping.
      #
      # `cargo tree` gets its OWN command: steps run under `bash -e` with
      # pipefail OFF, so inside a pipeline its exit status is discarded and a
      # broken manifest path / unresolvable dep / registry blip would print
      # nothing, fail `grep -q`, and pass this gate vacuously.
      - name: prepare crate is bevy-free
        run: |
          # Out of the repo: an untracked file here would make `cargo package` dirty.
          cargo tree --manifest-path prepare/Cargo.toml --prefix none --edges normal > "$RUNNER_TEMP/prepare-tree.txt"
          ! tail -n +2 "$RUNNER_TEMP/prepare-tree.txt" | grep '^bevy'
      - name: feature matrix
        run: |
          cargo check --no-default-features
          cargo check --features points
          cargo check --features splats
          cargo check --target wasm32-unknown-unknown --features points,splats
      - name: package
        run: |
          cargo package --no-verify --manifest-path prepare/Cargo.toml
          # The root package resolves its prepare dep from crates.io, so it can
          # only be dry-run-packaged once that version is published (the
          # lockstep pair — release.yml publishes prepare first). Until then,
          # skip loudly instead of failing every push.
          PREP_VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path prepare/Cargo.toml \
            | jq -r '.packages[] | select(.name == "bevy_3d_tiles_prepare") | .version')
          # Sparse index, NOT `cargo info` — run in-repo, cargo info resolves
          # the local path dep and reports unpublished versions as present.
          if curl -fsSL "https://index.crates.io/be/vy/bevy_3d_tiles_prepare" 2>/dev/null \
            | grep -q "\"vers\":\"$PREP_VERSION\""; then
            cargo package --no-verify
          else
            echo "::notice::skipping root cargo package — bevy_3d_tiles_prepare@$PREP_VERSION is not on crates.io yet (publish the lockstep pair)"
          fi
