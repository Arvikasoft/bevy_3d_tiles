# Fails when an issue's or PR's title or body, or a comment, holds a name on the
# private deny list (PUBLISH_DENY_REGEX). A run cannot hide the text, so the red
# run is the alert: edit the text at once and delete the old revision from its
# edit history. ci.yml scans a PR's title and body when it is opened or pushed
# to; this workflow also catches edits.
name: Text gate

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # _target, so an edit to a fork PR's text is scanned too (pull_request gives a
  # fork no secrets). It runs the base branch's workflow and never checks out PR
  # code: keep it that way.
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  scan:
    # Only for text written by people with ties to the repo: a public run's
    # red/green would otherwise let anyone test a guessed name against the list.
    # The comment comes first: a comment event also carries the issue it is on.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association || github.event.pull_request.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: scan the title and body
        env:
          DENY: ${{ secrets.PUBLISH_DENY_REGEX }}
        run: |
          jq -r '(.comment // .pull_request // .issue) | (.title // ""), (.body // "")' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/title-body"
          bash .github/deny-scan.sh "$RUNNER_TEMP/title-body"
