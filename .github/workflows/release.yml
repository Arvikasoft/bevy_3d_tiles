# Publishes to crates.io via Trusted Publishing (OIDC — no long-lived token).
# One-time setup on crates.io (crate Settings → Trusted Publishing): authorize
# this repository + the `release` environment for `bevy_3d_tiles`.
# Release flow: bump version in Cargo.toml → `git tag -a vX.Y.Z` (annotated: its
# message is the release note; the gate refuses a lightweight tag) → push the tag.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags + history: the announce step reads the annotated tag message
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Before anything is published or announced: the tag must be annotated (the
      # announcement posts its message, and a lightweight tag would post the raw
      # commit message), and nothing this release makes public may hold a name on
      # the private deny list: the tag name, the names and files of both packages,
      # the tag message, and the messages of the commits since the previous v* tag.
      # .github/deny-scan.sh prints only where a name is, never the name.
      - name: release gate
        env:
          DENY: ${{ secrets.PUBLISH_DENY_REGEX }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          # Re-fetch the tag so its local ref is the pushed object, not a lightweight copy.
          git fetch -q --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag. Delete it and push an annotated one: git tag -a $TAG"
            exit 1
          fi
          T="$RUNNER_TEMP/release-text"; mkdir -p "$T"
          git cat-file tag "refs/tags/$TAG" | sed '1,/^$/d' > "$T/tag-message"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          for c in $(git rev-list "$TAG" ${PREV:+--not "$PREV"}); do
            git log -1 --format=%B "$c" > "$T/commit-$c"
          done
          L="$RUNNER_TEMP/package-files"
          cargo package --list --allow-dirty --manifest-path prepare/Cargo.toml | sed 's|^|prepare/|' > "$L"
          # The root resolves prepare from crates.io, so its list fails until that
          # version is published. Then scan every tracked file: a superset of the
          # package, and ci.yml holds all of them to this scan already.
          cargo package --list --allow-dirty >> "$L" 2>/dev/null || git ls-files >> "$L"
          # --list also names files cargo generates (Cargo.toml.orig, .cargo_vcs_info.json).
          mapfile -t files < <(sort -u "$L" | while read -r f; do [ -f "$f" ] && echo "$f"; done)
          # Names first and alone: the content scan prints file paths.
          printf '%s\n' "$TAG" "${files[@]}" > "$RUNNER_TEMP/release-names"
          bash .github/deny-scan.sh "$RUNNER_TEMP/release-names"
          bash .github/deny-scan.sh "${files[@]}" "$T"/*
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Lockstep pair: the prepare crate must land FIRST or the root publish
      # cannot resolve its path+version dependency. Idempotent across re-runs:
      # skip if this exact version already exists.
      #
      # ONE-TIME SETUP, AND IT MUST HAPPEN BEFORE THE FIRST TAG: crates.io
      # attaches Trusted Publishing to an EXISTING crate, so it cannot be
      # authorized for a name that has never been published. Publish
      # `bevy_3d_tiles_prepare` 0.1.0 by hand with a personal token, THEN
      # authorize Trusted Publishing for it. Tagging first fails this step
      # with a 403 before the root publish runs, leaving the tag pushed —
      # recover by doing the manual publish + authorization and re-running.
      - name: publish bevy_3d_tiles_prepare
        run: |
          PREP_VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path prepare/Cargo.toml \
            | jq -r '.packages[] | select(.name == "bevy_3d_tiles_prepare") | .version')
          # Sparse index, NOT `cargo info` — run in-repo, cargo info resolves
          # the local path dep and reports unpublished versions as present.
          if curl -fsSL "https://index.crates.io/be/vy/bevy_3d_tiles_prepare" 2>/dev/null \
            | grep -q "\"vers\":\"$PREP_VERSION\""; then
            echo "bevy_3d_tiles_prepare $PREP_VERSION already on crates.io — skipping"
          else
            cargo publish --manifest-path prepare/Cargo.toml
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Announce the release in #bevy-3d-tiles on the public TurboTwin Discord
      # (the channel the crate README points users at). Runs only after a
      # successful publish, and never fails the release if Discord is down —
      # a missed announcement is not a broken release.
      - name: Announce on Discord
        if: success() && env.WEBHOOK != ''
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION: ${{ github.ref_name }}
        run: |
          # No GitHub Release object is created for this crate — crates.io is the
          # distribution channel and a library has no binaries to attach. Link
          # there instead. The release note is the ANNOTATED TAG's message, so
          # it lives with the tag and there is no CHANGELOG file to rot. For a
          # lightweight tag %(contents) is the raw commit message, so the release
          # gate refuses one before this step can run. 3500 bytes keeps
          # a full release note (0.5.0's is ~2.3 KB) plus the links below under
          # Discord's 4096-character embed description limit.
          NOTE=$(git for-each-ref --format='%(contents)' "refs/tags/$VERSION" | head -c 3500)
          PREV=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="https://github.com/Arvikasoft/bevy_3d_tiles/compare/$PREV...$VERSION"
          else
            RANGE="https://github.com/Arvikasoft/bevy_3d_tiles/commits/$VERSION"
          fi
          jq -n --arg v "$VERSION" --arg note "$NOTE" --arg range "$RANGE" '{
            embeds: [{
              title: "bevy_3d_tiles \($v)",
              url: "https://crates.io/crates/bevy_3d_tiles",
              description: (
                (if $note == "" then "" else $note + "\n\n" end)
                + "`cargo add bevy_3d_tiles` · [changes](\($range)) · [docs.rs](https://docs.rs/bevy_3d_tiles)"
              ),
              color: 5814783
            }]
          }' | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
